name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional-title:
    name: Conventional Commits 標題檢查
    runs-on: ubuntu-latest
    steps:
      - name: 檢查 PR 標題
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "✅ PR 標題符合 Conventional Commits：$TITLE"
          else
            echo "::error::PR 標題不符合 Conventional Commits：$TITLE"
            echo "格式：type(scope): 描述，例如 feat(review): 新增瑕疵標記轉退件單 (#12)"
            exit 1
          fi
